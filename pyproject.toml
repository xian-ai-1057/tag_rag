[project]
name = "tag-rag"
version = "0.1.0"
description = "RAG with inline chunk-level citations — local Ollama + ChromaDB + Streamlit"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "streamlit>=1.40",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["rag.py", "app.py"]
